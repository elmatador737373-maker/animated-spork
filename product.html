<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dettaglio Prodotto - NOVA SHOP</title>
    <style>
        body { background: #0a0a0c; color: #fff; font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #0a0a0c; border-bottom: 2px solid #ff003c; }
        .content { padding: 40px; flex: 1; }
        .product-container { max-width: 800px; margin: 0 auto; background: #121216; border: 1px solid #ff003c; padding: 30px; border-radius: 10px; display: flex; gap: 30px; }
        .product-container img { width: 300px; height: 300px; border-radius: 8px; object-fit: cover; }
        .btn { background: #ff003c; color: #fff; padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; width: 100%; text-align: center; }
        .discord-float { position: fixed; bottom: 20px; right: 20px; background: #ff003c; color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255, 0, 60, 0.5); z-index: 1000; text-decoration: none; transition: transform 0.2s; }
        .discord-float:hover { transform: scale(1.1); }
        .discord-float svg { width: 28px; height: 28px; fill: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="logo.jpg" alt="NOVA SHOP Logo" style="height: 45px; width: auto; border-radius: 6px; box-shadow: 0 0 10px rgba(255, 0, 60, 0.4);">
            </a>
            <div id="auth-container">
                <a href="/auth/discord" style="background: #5865F2; color: #fff; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.9rem;">Accedi con Discord</a>
            </div>
        </div>
    </header>

    <div class="content">
        <a href="index.html" style="color: #888; text-decoration: none; margin-bottom: 20px; display: inline-block;">&larr; Torna allo Shop</a>
        <div id="product-details" class="product-container"></div>
    </div>

    <a href="https://discord.gg/7r46nnRBvY" target="_blank" class="discord-float" title="Entra nel Server Discord">
        <svg viewBox="0 0 127.14 96.36">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.68,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.63-27.29-4.5-51.19-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.14,46,96.12,53,90.95,65.69,84.69,65.69Z"/>
        </svg>
    </a>

    <script>
        async function checkAuth() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                const authContainer = document.getElementById('auth-container');
                if (data.loggedIn) {
                    authContainer.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <img src="${data.user.avatar}" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%;">
                            <span style="font-weight: bold; font-size: 0.9rem;">${data.user.global_name}</span>
                            <a href="orders.html" style="color: #fff; text-decoration: none; margin-left: 10px; font-weight: bold; font-size: 0.9rem;">I Miei Ordini</a>
                            <a href="admin.html" style="background: #ff003c; color: #fff; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.85rem; margin-left: 5px;">Admin</a>
                            <a href="/auth/logout" style="background: #333; color: #ff003c; padding: 6px 10px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.85rem; margin-left: 5px;">Esci</a>
                        </div>
                    `;
                }
            } catch (err) { console.error(err); }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function loadProduct() {
            try {
                const res = await fetch(`/api/products/${productId}`);
                if (!res.ok) {
                    document.querySelector('.content').innerHTML = '<h1 style="color: #ff003c; text-align:center;">Prodotto non trovato</h1>';
                    return;
                }
                const p = await res.json();
                document.getElementById('product-details').innerHTML = `
                    <img src="${p.image}" alt="${p.name}">
                    <div style="flex: 1;">
                        <h1>${p.name}</h1>
                        <p style="color: #aaa; margin: 15px 0;">${p.description || 'Nessuna descrizione disponibile.'}</p>
                        <p>Variante: <strong>${p.variant}</strong></p>
                        <p>Stock Disponibile: <strong style="color: ${p.stock > 0 ? '#22c55e' : '#ff003c'};">${p.stock}</strong></p>
                        <h2 style="color: #ff003c; margin: 15px 0;">€${Number(p.price).toFixed(2)}</h2>
                        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
                        <button class="btn" onclick="buyProduct('${p.id}')">Ordina Ora (Login Discord Richiesto)</button>
                    </div>
                `;
            } catch (err) { console.error(err); }
        }

        async function buyProduct(id) {
            const authRes = await fetch('/api/auth/me');
            const authData = await authRes.json();

            if (!authData.loggedIn) {
                alert('Devi effettuare prima il login con Discord per poter ordinare!');
                window.location.href = '/auth/discord';
                return;
            }

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId: id })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    alert(`✅ Ordine #${data.order.id} creato con successo!\n\nVerrai ora reindirizzato al server Discord ufficiale. Entra subito ed apri un ticket per completare il pagamento!\n\nLink diretto: https://discord.gg/7r46nnRBvY`);
                    window.location.href = data.discordServerUrl;
                } else {
                    alert(data.error || 'Errore durante la creazione dell\'ordine.');
                }
            } catch (err) { console.error(err); alert('Errore di connessione al server.'); }
        }

        checkAuth();
        loadProduct();
    </script>
</body>
</html>
