<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>NOVA SHOP - Store Ufficiale</title>
    <style>
        body { background: #0a0a0c; color: #fff; font-family: sans-serif; margin: 0; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #0a0a0c; border-bottom: 2px solid #ff003c; }
        .content { padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #121216; border: 1px solid #222; border-radius: 8px; overflow: hidden; padding: 15px; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
        .btn { display: inline-block; background: #ff003c; color: #fff; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="logo.png" alt="NOVA SHOP Logo" style="height: 45px; width: auto; border-radius: 6px; box-shadow: 0 0 10px rgba(255, 0, 60, 0.4);">
            </a>
            <div>
                <a href="orders.html" style="color: #fff; text-decoration: none; margin-right: 15px; font-weight: bold;">I Miei Ordini</a>
                <a href="admin.html" style="background: #ff003c; color: #fff; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: bold;">Admin</a>
            </div>
        </div>
    </header>

    <div class="content">
        <h2>Prodotti Disponibili</h2>
        <div id="products-grid" class="grid"></div>
    </div>

    <script>
        async function loadProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.image}">
                    <h3>${p.name}</h3>
                    <p style="color: #888;">Stock: ${p.stock}</p>
                    <p style="font-size: 1.2rem; font-weight: bold; color: #ff003c;">€${p.price.toFixed(2)}</p>
                    <a href="product.html?id=${p.id}" class="btn">Vedi Dettagli</a>
                </div>
            `).join('');
        }
        loadProducts();
    </script>
</body>
</html>
