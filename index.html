<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .toolbar {
            background: #18181b;
            padding: 8px 12px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #27272a;
            flex-shrink: 0;
            z-index: 100;
        }
        .toolbar button {
            background: #27272a;
            color: #f4f4f5;
            border: 1px solid #3f3f46;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .toolbar button:active { background: #3f3f46; }
        .btn-stop { color: #f87171 !important; border-color: #ef4444 !important; }
        #terminal-container { flex-grow: 1; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="app">
        <div class="toolbar">
            <button onclick="pasteText()">📋 Incolla</button>
            <button class="btn-stop" onclick="stopProcess()">🛑 Ferma (CTRL+C)</button>
            <button onclick="clearTerminal()">🧹 Pulisci</button>
        </div>
        <div id="terminal-container"></div>
    </div>

    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            theme: { background: '#000000' }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        // Connessione corretta al WebSocket nativo di ttyd
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}${window.location.pathname.replace(/\/$/, '')}/ws`;
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            // ttyd richiede l'invio dei dati formattati come stringa JSON o testo
            term.onData(data => {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(data);
                }
            });
            window.addEventListener('resize', () => fitAddon.fit());
        };

        socket.onmessage = ev => {
            term.write(ev.data);
        };

        // 📋 Incolla funzionante sia su PC che da Smartphone
        async function pasteText() {
            let text = "";
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    text = await navigator.clipboard.readText();
                }
            } catch (err) {
                // Se il browser blocca l'accesso agli appunti (es. Safari o contesti non HTTPS)
            }

            // Fallback se il clipboard è vuoto o bloccato
            if (!text) {
                text = prompt("Incolla qui il testo da inviare:");
            }

            if (text && socket.readyState === WebSocket.OPEN) {
                socket.send(text);
            }
        }

        // 🛑 Ferma (Invia CTRL+C)
        function stopProcess() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send('\x03');
            }
        }

        // 🧹 Pulisci lo schermo
        function clearTerminal() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send('clear\r');
            }
            term.clear();
        }
    </script>
</body>
</html>
