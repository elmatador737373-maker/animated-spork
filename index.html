<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Terminal Mobile</title>
    <!-- Librerie grafiche xterm.js per rendere il terminale visibile ovunque -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
        
        /* Layout flessibile: barra in alto, terminale sotto */
        #app { display: flex; flex-direction: column; height: 100vh; }
        
        /* Barra pulsanti per touch e mobile */
        .toolbar {
            background: #18181b;
            padding: 8px 12px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #27272a;
            flex-shrink: 0;
        }
        .toolbar button {
            background: #27272a;
            color: #f4f4f5;
            border: 1px solid #3f3f46;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .toolbar button:active { background: #3f3f46; }
        .btn-stop { color: #f87171 !important; border-color: #ef4444 !important; }
        
        #terminal-container { flex-grow: 1; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="app">
        <div class="toolbar">
            <button onclick="pasteText()">📋 Incolla</button>
            <button class="btn-stop" onclick="stopProcess()">🛑 Ferma (CTRL+C)</button>
            <button onclick="clearTerminal()">🧹 Pulisci</button>
        </div>
        <div id="terminal-container"></div>
    </div>

    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            theme: { background: '#000000' }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        // Connessione WebSocket a ttyd
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            term.onData(data => socket.send(data));
            socket.onmessage = ev => term.write(ev.data);
            window.addEventListener('resize', () => fitAddon.fit());
        };

        // 📋 Incolla da mobile
        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(text);
                }
            } catch (err) {
                // Fallback con prompt manuale se il browser blocca l'accesso automatico agli appunti
                const manualText = prompt("Incolla qui il testo:");
                if (manualText && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(manualText);
                }
            }
        }

        // 🛑 Ferma (Invia CTRL+C / \x03)
        function stopProcess() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send('\x03');
            }
        }

        // 🧹 Pulisci
        function clearTerminal() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send('clear\r');
            }
            term.clear();
        }
    </script>
</body>
</html>
