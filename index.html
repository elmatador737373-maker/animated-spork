<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Web Terminal</title>
    <!-- Mantiene gli stili e le risorse originali di ttyd -->
    <link rel="stylesheet" href="auth_token.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
        
        /* Contenitore pulsanti in sovrimpressione */
        .btn-container {
            position: fixed;
            top: 10px;
            right: 25px;
            z-index: 99999;
            display: flex;
            gap: 8px;
        }
        .btn-container button {
            background: #1a1a1a;
            color: #22c55e;
            border: 1px solid #333;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .btn-container button:hover { background: #2a2a2a; border-color: #555; }
        .btn-container button:active { background: #333; }
        .btn-stop { color: #ef4444 !important; }
    </style>
</head>
<body>
    <!-- Pulsanti di controllo -->
    <div class="btn-container">
        <button onclick="pasteText()">📋 Incolla</button>
        <button class="btn-stop" onclick="stopProcess()">🛑 Ferma (CTRL+C)</button>
        <button onclick="clearTerminal()">🧹 Pulisci</button>
    </div>

    <!-- Script originali forniti da ttyd -->
    <script src="token.js"></script>
    <script src="client.js"></script>

    <!-- Script per i pulsanti -->
    <script>
        // Funzione per Incollare dal clipboard
        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                // Invia il testo direttamente al WebSocket del terminale
                if (window.term) {
                    window.term.write(text);
                } else {
                    // Fallback tramite simulazione input
                    const event = new ClipboardEvent('paste', {
                        clipboardData: new DataTransfer()
                    });
                    event.clipboardData.setData('text/plain', text);
                    document.dispatchEvent(event);
                }
            } catch (err) {
                alert('Impossibile incollare. Verifica i permessi del browser o usa la scorciatoia SHIFT+INSERT.');
            }
        }

        // Funzione per inviare CTRL+C
        function stopProcess() {
            // Codice ASCII \x03 corrisponde a CTRL+C
            const ev = new KeyboardEvent('keydown', { keyCode: 67, ctrlKey: true, bubbles: true });
            document.dispatchEvent(ev);
        }

        // Funzione per Pulire lo schermo
        function clearTerminal() {
            if (window.term) {
                window.term.clear();
            }
        }
    </script>
</body>
</html>
