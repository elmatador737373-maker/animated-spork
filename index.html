<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Terminal</title>
    <!-- CSS di Xterm.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra strumenti mobile */
        #mobile-toolbar {
            background-color: #1a1a1a;
            padding: 8px 12px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #333;
            z-index: 1000;
        }

        .btn {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn:active {
            background-color: #005999;
        }

        /* Contenitore Terminale */
        #terminal-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Barra con pulsante per smartphone -->
    <div id="mobile-toolbar">
        <button class="btn" onclick="pasteFromClipboard()">📋 Incolla</button>
    </div>

    <div id="terminal-container"></div>

    <!-- JS di Xterm.js e moduli WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-attach@0.9.0/lib/xterm-addon-attach.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

    <script>
        // Inizializzazione Terminale
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            theme: {
                background: '#000000'
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const container = document.getElementById('terminal-container');
        term.open(container);
        fitAddon.fit();

        // Connessione WebSocket a ttyd
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsUrl = protocol + location.host + '/ws';
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            const attachAddon = new AttachAddon.AttachAddon(socket);
            term.loadAddon(attachAddon);
        };

        // Ridimensionamento automatico alla finestra
        window.addEventListener('resize', () => fitAddon.fit());

        // Funzione per Incollare su Smartphone
        async function pasteFromClipboard() {
            try {
                // Richiede l'accesso agli appunti del dispositivo
                const text = await navigator.clipboard.readText();
                if (text && socket.readyState === WebSocket.OPEN) {
                    socket.send(new TextEncoder().encode(text));
                    term.focus();
                }
            } catch (err) {
                alert('Impossibile accedere agli appunti. Assicurati che la pagina sia in HTTPS o concedi i permessi al browser.');
            }
        }
    </script>
</body>
</html>
