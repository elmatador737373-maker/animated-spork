<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop - Prodotti</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --primary: #ff2a00;
            --primary-glow: rgba(255, 42, 0, 0.4);
            --bg-glass: rgba(15, 2, 2, 0.75);
            --border-glass: rgba(255, 42, 0, 0.25);
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #050000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Navbar Modern & Clean */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--primary);
        }

        .logo-container h2 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links a {
            color: #bbb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
        }

        /* Container e Vetrina Prodotti */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
            position: relative;
            z-index: 2;
        }

        .page-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 42, 0, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: rgba(255, 42, 0, 0.6);
            transform: translateY(-3px);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 42, 0, 0.2);
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 1.1rem;
            margin: 0 0 6px 0;
            color: #fff;
        }

        .card p {
            font-size: 0.85rem;
            color: #aaa;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .card-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.25rem;
            color: #ff4400;
            font-weight: 700;
        }

        .stock-badge {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .stock-badge.available {
            background: rgba(0, 255, 100, 0.12);
            color: #00ff64;
            border: 1px solid rgba(0, 255, 100, 0.25);
        }

        .stock-badge.out {
            background: rgba(255, 0, 0, 0.12);
            color: #ff4444;
            border: 1px solid rgba(255, 0, 0, 0.25);
        }

        .btn-buy {
            background: linear-gradient(135deg, #ff2a00, #cc1100);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: transform 0.1s;
        }

        .btn-buy:active {
            transform: scale(0.98);
        }

        .btn-buy:disabled {
            background: #222;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .info-message {
            text-align: center;
            color: #888;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 30px;
            border-radius: 14px;
            font-size: 0.95rem;
            grid-column: 1 / -1;
        }

        /* Profilo Utente Navbar */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-profile img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .user-profile span {
            font-size: 0.8rem;
            color: #ddd;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-logout {
            color: #ff5555 !important;
            font-size: 0.8rem !important;
        }

        @media (max-width: 480px) {
            nav { padding: 10px 15px; }
            .container { margin: 15px auto; }
            .page-title { font-size: 1.4rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="sky-flash" id="flash"></div>
    <canvas id="lightningCanvas"></canvas>

    <nav>
        <div class="logo-container">
            <img src="/logo.jpg" alt="Logo" class="logo">
            <h2>Nova Shop</h2>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/products.html" class="active">Prodotti</a>
            <a href="/cart.html">Carrello</a>
            <span id="authArea"><a href="/auth/discord" class="btn-discord">Accedi</a></span>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">⚡ Vetrina Prodotti</h1>
        <div id="productGrid" class="grid">
            <div class="info-message">Caricamento prodotti in corso...</div>
        </div>
    </div>

    <script>
        fetch('/api/me').then(res => res.json()).then(({ user, isAdmin }) => {
            if (user) {
                document.getElementById('authArea').innerHTML = `
                    <div class="user-profile">
                        <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" alt="Avatar">
                        <span>${user.username}</span>
                    </div>
                    <a href="/logout" class="btn-logout">Esci</a>
                `;
                if (isAdmin) {
                    const links = document.getElementById('navLinks');
                    const adminLink = document.createElement('a');
                    adminLink.href = '/admin.html';
                    adminLink.textContent = 'Admin';
                    links.insertBefore(adminLink, document.getElementById('authArea'));
                }
            }
        });

        fetch('/api/products').then(res => res.json()).then(products => {
            const grid = document.getElementById('productGrid');
            if(products.length === 0) {
                grid.innerHTML = '<div class="info-message">Nessun prodotto disponibile al momento.</div>';
            } else {
                grid.innerHTML = products.map(p => `
                    <div class="card">
                        <div>
                            <img src="${p.image}" alt="${p.name}">
                            <h3>${p.name} ${p.variant ? '('+p.variant+')' : ''}</h3>
                            <p>${p.description || 'Nessuna descrizione disponibile.'}</p>
                        </div>
                        <div class="card-footer">
                            <div class="card-meta">
                                <span class="price">€${p.price}</span>
                                <span class="stock-badge ${p.stock > 0 ? 'available' : 'out'}">
                                    ${p.stock > 0 ? p.stock + ' disponibili' : 'Esaurito'}
                                </span>
                            </div>
                            <button class="btn-buy" onclick="buy(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price})" ${p.stock <= 0 ? 'disabled' : ''}>
                                ${p.stock > 0 ? 'Acquista Ora' : 'Esaurito'}
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        });

        async function buy(productId, productName, price) {
            const res = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId, productName, price })
            });
            const data = await res.json();
            if(data.success) {
                alert('Ordine effettuato! Unisciti al server Discord per completare il pagamento tramite ticket.');
                window.location.href = 'https://discord.gg/ACX7HmxHnQ';
            } else {
                alert('Errore: ' + (data.error || 'Devi fare il login!'));
                if(res.status === 401) window.location.href = '/auth/discord';
            }
        }

        // Script Canvas Fulmini
        const canvas = document.getElementById('lightningCanvas');
        const ctx = canvas.getContext('2d');
        const flashEl = document.getElementById('flash');

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const config = { segmentLength: 12, growthSpeed: 2, deviation: 22, branchChance: 0.18 };
        let activeLightnings = [];

        class RealLightning {
          constructor(startX, startY, angle, isBranch = false, parentWidth = 4) {
            this.segments = [];
            this.currentProgress = 0;
            this.isBranch = isBranch;
            this.state = "GROWING";
            this.flickerFrame = 0;
            this.totalFlickers = 4 + Math.floor(Math.random() * 3);
            this.opacity = 1;
            this.lineWidth = isBranch ? parentWidth * 0.5 : parentWidth;
            this.generatePath(startX, startY, angle);
          }

          generatePath(x, y, angle) {
            let curX = x;
            let curY = y;
            this.segments.push({ x: curX, y: curY });
            while (curY < canvas.height && this.segments.length < 80) {
              const rad = (angle * Math.PI) / 180;
              const targetX = curX + Math.sin(rad) * config.segmentLength + (Math.random() - 0.5) * config.deviation;
              const targetY = curY + Math.cos(rad) * config.segmentLength + Math.random() * (config.segmentLength * 0.5);
              this.segments.push({ x: targetX, y: targetY });
              curX = targetX;
              curY = targetY;
              if (!this.isBranch && Math.random() < config.branchChance) {
                const branchAngle = angle + (Math.random() > 0.5 ? 45 : -45);
                activeLightnings.push(new RealLightning(curX, curY, branchAngle, true, this.lineWidth));
              }
            }
          }

          update() {
            if (this.state === "GROWING") {
              this.currentProgress += config.growthSpeed;
              if (this.currentProgress >= this.segments.length) {
                this.state = this.isBranch ? "FADING" : "STRIKE";
              }
            } else if (this.state === "STRIKE") {
              this.flickerFrame++;
              if (this.flickerFrame % 2 === 0) {
                flashEl.style.opacity = (Math.random() * 0.7 + 0.3).toString();
              } else {
                flashEl.style.opacity = '0';
              }
              if (this.flickerFrame >= this.totalFlickers * 2) {
                this.state = "FADING";
                flashEl.style.opacity = '0';
              }
            } else if (this.state === "FADING") {
              this.opacity -= 0.08;
            }
          }

          draw() {
            if (this.opacity <= 0 || this.currentProgress === 0) return;
            ctx.beginPath();
            ctx.moveTo(this.segments[0].x, this.segments[0].y);
            const limit = Math.min(this.currentProgress, this.segments.length);
            for (let i = 1; i < limit; i++) {
              ctx.lineTo(this.segments[i].x, this.segments[i].y);
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (this.state === "STRIKE" && this.flickerFrame % 2 !== 0) {
              ctx.strokeStyle = 'transparent';
            } else {
              ctx.strokeStyle = `rgba(255, 240, 240, ${this.opacity})`;
              ctx.lineWidth = this.state === "STRIKE" ? this.lineWidth * 1.5 : this.lineWidth;
            }
            ctx.stroke();
          }
        }

        function loop() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          activeLightnings = activeLightnings.filter(l => l.opacity > 0);
          activeLightnings.forEach(lightning => {
            lightning.update();
            lightning.draw();
          });
          requestAnimationFrame(loop);
        }

        function stormController() {
          const startX = Math.random() * canvas.width;
          flashEl.style.setProperty('--flash-x', `${(startX / canvas.width) * 100}%`);
          activeLightnings.push(new RealLightning(startX, 0, 0, false, 4.5));
          setTimeout(stormController, 1000 + Math.random() * 3500);
        }

        loop();
        setTimeout(stormController, 600);
    </script>
</body>
</html>
