<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop - Prodotti</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: rgba(18, 0, 0, 0.85); border: 1px solid #ff2a00; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 0 12px rgba(255,0,0,0.15); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; border: 1px solid #440000; }
        .card h3 { font-size: 1.1rem; margin: 10px 0 5px; }
        .card p { font-size: 0.85rem; color: #ccc; margin: 5px 0; }
        .btn-buy { background: #ff2a00; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; transition: 0.2s; }
        .btn-buy:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="lightning-bg"></div>
    <nav>
        <div class="logo-container">
            <img src="/logo.jpg" alt="Logo" class="logo">
            <h2>Nova Shop</h2>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/products.html">Prodotti</a>
            <a href="/cart.html">Carrello</a>
            <span id="authArea"><a href="/auth/discord" class="btn-discord">Accedi</a></span>
        </div>
    </nav>
    <div class="container">
        <h1>⚡ Vetrina Prodotti ⚡</h1>
        <div id="productGrid" class="grid">
            <p style="text-align:center; width:100%;">Caricamento prodotti...</p>
        </div>
    </div>
    <script>
        fetch('/api/me').then(res => res.json()).then(({ user, isAdmin }) => {
            if (user) {
                document.getElementById('authArea').innerHTML = `
                    <div class="user-profile">
                        <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" alt="Avatar">
                        <span>${user.username}</span>
                    </div>
                    <a href="/logout" class="btn-logout">Esci</a>
                `;
                if (isAdmin) {
                    const links = document.getElementById('navLinks');
                    const adminLink = document.createElement('a');
                    adminLink.href = '/admin.html';
                    adminLink.textContent = 'Admin';
                    links.insertBefore(adminLink, document.getElementById('authArea'));
                }
            }
        });

        fetch('/api/products').then(res => res.json()).then(products => {
            const grid = document.getElementById('productGrid');
            if(products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">Nessun prodotto disponibile.</p>';
            } else {
                grid.innerHTML = products.map(p => `
                    <div class="card">
                        <div>
                            <img src="${p.image}" alt="${p.name}">
                            <h3>${p.name} ${p.variant ? '('+p.variant+')' : ''}</h3>
                            <p>${p.description || ''}</p>
                        </div>
                        <div>
                            <p><strong>Stock:</strong> ${p.stock > 0 ? p.stock + ' disponibili' : 'Esaurito'}</p>
                            <p style="font-size: 1.2rem; color: #ff4400; font-weight: bold;">€${p.price}</p>
                            <button class="btn-buy" onclick="buy(${p.id}, '${p.name}', ${p.price})" ${p.stock <= 0 ? 'disabled style="background:#333;cursor:not-allowed;"' : ''}>
                                ${p.stock > 0 ? 'Acquista Ora' : 'Esaurito'}
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        });

        async function buy(productId, productName, price) {
            const res = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId, productName, price })
            });
            const data = await res.json();
            if(data.success) {
                alert('Ordine effettuato! Unisciti al server Discord per completare il pagamento tramite ticket.');
                window.location.href = 'https://discord.gg/ACX7HmxHnQ';
            } else {
                alert('Errore: ' + (data.error || 'Devi fare il login!'));
                if(res.status === 401) window.location.href = '/auth/discord';
            }
        }
    </script>
</body>
</html>
