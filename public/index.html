<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop - Home</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --primary: #ff2a00;
            --primary-glow: rgba(255, 42, 0, 0.4);
            --bg-glass: rgba(15, 2, 2, 0.75);
            --border-glass: rgba(255, 42, 0, 0.25);
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #050000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Navigazione Modern & Clean */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--primary);
        }

        .logo-container h2 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links a {
            color: #bbb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
        }

        /* Hero Section Ottimizzata Mobile */
        .hero-wrapper {
            min-height: calc(85vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .hero-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 35px 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 25px var(--primary-glow);
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 42, 0, 0.12);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 42, 0, 0.3);
        }

        .hero-card h1 {
            font-size: 1.85rem;
            line-height: 1.2;
            margin: 0 0 12px 0;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 42, 0, 0.5);
        }

        .hero-card p {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 u 25px 0;
        }

        .btn-cta {
            background: linear-gradient(135deg, #ff2a00, #cc1100);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 5px 20px var(--primary-glow);
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-cta:active {
            transform: scale(0.98);
        }

        /* Profilo Utente Navbar */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-profile img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .user-profile span {
            font-size: 0.8rem;
            color: #ddd;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-logout {
            color: #ff5555 !important;
            font-size: 0.8rem !important;
        }

        /* Adattamento perschermi molto piccoli / mobile */
        @media (max-width: 480px) {
            nav { padding: 10px 15px; }
            .nav-links { gap: 10px; }
            .hero-card { padding: 25px 15px; }
            .hero-card h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="sky-flash" id="flash"></div>
    <canvas id="lightningCanvas"></canvas>

    <nav>
        <div class="logo-container">
            <img src="/logo.jpg" alt="Logo" class="logo">
            <h2>Nova Shop</h2>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/" class="active">Home</a>
            <a href="/products.html">Prodotti</a>
            <a href="/cart.html">Carrello</a>
            <span id="authArea"><a href="/auth/discord" class="btn-discord">Accedi</a></span>
        </div>
    </nav>

    <div class="hero-wrapper">
        <div class="hero-card">
            <div class="hero-badge">⚡ Servizi Digitali Premium</div>
            <h1>Il futuro dello shopping digitale</h1>
            <p>Prodotti esclusivi, consegne istantanee e massima sicurezza in un'unica piattaforma automatizzata.</p>
            <a href="/products.html" class="btn-cta">Esplora i Prodotti</a>
        </div>
    </div>

    <script>
        fetch('/api/me').then(res => res.json()).then(({ user, isAdmin }) => {
            if (user) {
                document.getElementById('authArea').innerHTML = `
                    <div class="user-profile">
                        <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" alt="Avatar">
                        <span>${user.username}</span>
                    </div>
                    <a href="/logout" class="btn-logout">Esci</a>
                `;
                if (isAdmin) {
                    const links = document.getElementById('navLinks');
                    const adminLink = document.createElement('a');
                    adminLink.href = '/admin.html';
                    adminLink.textContent = 'Admin';
                    links.insertBefore(adminLink, document.getElementById('authArea'));
                }
            }
        });

        // Script Canvas Fulmini
        const canvas = document.getElementById('lightningCanvas');
        const ctx = canvas.getContext('2d');
        const flashEl = document.getElementById('flash');

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const config = { segmentLength: 12, growthSpeed: 2, deviation: 22, branchChance: 0.18 };
        let activeLightnings = [];

        class RealLightning {
          constructor(startX, startY, angle, isBranch = false, parentWidth = 4) {
            this.segments = [];
            this.currentProgress = 0;
            this.isBranch = isBranch;
            this.state = "GROWING";
            this.flickerFrame = 0;
            this.totalFlickers = 4 + Math.floor(Math.random() * 3);
            this.opacity = 1;
            this.lineWidth = isBranch ? parentWidth * 0.5 : parentWidth;
            this.generatePath(startX, startY, angle);
          }

          generatePath(x, y, angle) {
            let curX = x;
            let curY = y;
            this.segments.push({ x: curX, y: curY });
            while (curY < canvas.height && this.segments.length < 80) {
              const rad = (angle * Math.PI) / 180;
              const targetX = curX + Math.sin(rad) * config.segmentLength + (Math.random() - 0.5) * config.deviation;
              const targetY = curY + Math.cos(rad) * config.segmentLength + Math.random() * (config.segmentLength * 0.5);
              this.segments.push({ x: targetX, y: targetY });
              curX = targetX;
              curY = targetY;
              if (!this.isBranch && Math.random() < config.branchChance) {
                const branchAngle = angle + (Math.random() > 0.5 ? 45 : -45);
                activeLightnings.push(new RealLightning(curX, curY, branchAngle, true, this.lineWidth));
              }
            }
          }

          update() {
            if (this.state === "GROWING") {
              this.currentProgress += config.growthSpeed;
              if (this.currentProgress >= this.segments.length) {
                this.state = this.isBranch ? "FADING" : "STRIKE";
              }
            } else if (this.state === "STRIKE") {
              this.flickerFrame++;
              if (this.flickerFrame % 2 === 0) {
                flashEl.style.opacity = (Math.random() * 0.7 + 0.3).toString();
              } else {
                flashEl.style.opacity = '0';
              }
              if (this.flickerFrame >= this.totalFlickers * 2) {
                this.state = "FADING";
                flashEl.style.opacity = '0';
              }
            } else if (this.state === "FADING") {
              this.opacity -= 0.08;
            }
          }

          draw() {
            if (this.opacity <= 0 || this.currentProgress === 0) return;
            ctx.beginPath();
            ctx.moveTo(this.segments[0].x, this.segments[0].y);
            const limit = Math.min(this.currentProgress, this.segments.length);
            for (let i = 1; i < limit; i++) {
              ctx.lineTo(this.segments[i].x, this.segments[i].y);
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (this.state === "STRIKE" && this.flickerFrame % 2 !== 0) {
              ctx.strokeStyle = 'transparent';
            } else {
              ctx.strokeStyle = `rgba(255, 240, 240, ${this.opacity})`;
              ctx.lineWidth = this.state === "STRIKE" ? this.lineWidth * 1.5 : this.lineWidth;
            }
            ctx.stroke();
          }
        }

        function loop() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          activeLightnings = activeLightnings.filter(l => l.opacity > 0);
          activeLightnings.forEach(lightning => {
            lightning.update();
            lightning.draw();
          });
          requestAnimationFrame(loop);
        }

        function stormController() {
          const startX = Math.random() * canvas.width;
          flashEl.style.setProperty('--flash-x', `${(startX / canvas.width) * 100}%`);
          activeLightnings.push(new RealLightning(startX, 0, 0, false, 4.5));
          setTimeout(stormController, 1000 + Math.random() * 3500);
        }

        loop();
        setTimeout(stormController, 600);
    </script>
</body>
</html>
