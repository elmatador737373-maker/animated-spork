<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #010103; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        #lightning-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.9;
        }

        .navbar { background: rgba(1, 1, 3, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 34, 0, 0.2); }
        .logo-glow { filter: drop-shadow(0 0 20px rgba(255, 34, 0, 0.4)); }
        
        .product-card { 
            background: rgba(10, 10, 12, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .product-card:hover { border-color: #ff2200; transform: translateY(-5px); }
    </style>
</head>
<body>

    <canvas id="lightning-canvas"></canvas>

    <!-- NAVBAR -->
    <header class="navbar fixed w-full top-0 z-50 px-6 py-4 flex justify-between items-center">
        <a href="/">
            <img src="/logo.jpg" alt="Logo" class="h-10 w-auto">
        </a>
        <div id="auth-container">
            <a href="/auth/discord" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm font-bold transition">
                <i class="fa-brands fa-discord mr-2"></i>Login
            </a>
        </div>
    </header>

    <!-- HERO -->
    <section class="relative pt-32 pb-16 text-center z-10">
        <img src="/logo.jpg" alt="Logo" class="w-48 h-48 mx-auto logo-glow mb-6 object-cover rounded-2xl">
        <h1 class="text-3xl font-black uppercase tracking-tighter">Nova Shop</h1>
    </section>

    <!-- PRODOTTI -->
    <main class="container mx-auto px-6 pb-20 relative z-10">
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Caricamento dinamico -->
        </div>
    </main>

    <script>
        // MOTORE FULMINI STILE LOGO
        const canvas = document.getElementById('lightning-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class Bolt {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * w; this.y = 0;
                this.vx = (Math.random() - 0.5) * 20; this.vy = Math.random() * 10 + 5;
                this.alpha = 1; this.life = 1;
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                this.x += this.vx; this.y += this.vy;
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `rgba(255, 34, 0, ${this.alpha})`;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff2200';
                ctx.stroke();
                this.alpha -= 0.02;
            }
        }
        let bolts = [];
        function animate() {
            ctx.fillStyle = 'rgba(1, 1, 3, 0.15)'; ctx.fillRect(0, 0, w, h);
            if(Math.random() < 0.2) bolts.push(new Bolt());
            bolts = bolts.filter(b => b.alpha > 0);
            bolts.forEach(b => b.draw());
            requestAnimationFrame(animate);
        }
        animate();

        // CARICAMENTO PRODOTTI
        async function load() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(p => `
                <div class="product-card p-4 rounded-2xl">
                    <img src="${p.image}" class="w-full h-40 object-cover rounded-xl mb-4">
                    <h3 class="font-bold text-lg">${p.name}</h3>
                    <p class="text-red-500 font-bold my-2">€${Number(p.price).toFixed(2)}</p>
                    <a href="/product.html?id=${p.id}" class="block text-center bg-[#ff2200] hover:bg-red-700 py-2 rounded-lg font-bold text-sm">Acquista</a>
                </div>
            `).join('');
        }
        load();
    </script>
</body>
</html>
