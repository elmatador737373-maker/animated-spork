<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop - Pannello Admin</title>
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #030000; color: white; overflow-x: hidden; }
        .lightning-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(180,0,0,0.2) 0%, rgba(3,0,0,1) 90%); z-index: -1; animation: flash 4s infinite; }
        @keyframes flash { 0%, 90%, 96%, 100% { opacity: 0.7; } 92%, 94% { opacity: 1; background: radial-gradient(circle, rgba(255,40,0,0.5) 0%, rgba(30,0,0,1) 90%); } }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: rgba(10,0,0,0.95); border-bottom: 2px solid #ff2a00; }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .logo { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ff2a00; object-fit: cover; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; font-weight: bold; }
        .btn-discord { background: #5865F2; padding: 8px 16px; border-radius: 6px; display: flex; align-items: center; gap: 8px; }
        .btn-logout { background: #ff2a00; padding: 6px 12px; border-radius: 5px; font-size: 0.9rem; }
        .user-profile { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px 15px; border-radius: 20px; border: 1px solid #441111; }
        .user-profile img { width: 32px; height: 32px; border-radius: 50%; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        h1 { text-align: center; color: #ff3300; text-shadow: 0 0 10px rgba(255,50,0,0.5); }
        .admin-panel { background: rgba(30, 0, 0, 0.95); border: 2px dashed #ff2a00; padding: 30px; border-radius: 10px; margin-top: 20px; }
        .admin-panel input, .admin-panel textarea { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #441111; color: white; border-radius: 4px; box-sizing: border-box; }
        .admin-panel button { background: #00aa55; color: white; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="lightning-bg"></div>
    <nav>
        <div class="logo-container">
            <img src="/logo.jpg" alt="Logo" class="logo">
            <h2 style="margin:0; color: #ff3300;">Nova Shop</h2>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/products.html">Prodotti</a>
            <a href="/cart.html">Carrello & Ordini</a>
            <span id="authArea"><a href="/auth/discord" class="btn-discord">Accedi con Discord</a></span>
        </div>
    </nav>
    <div class="container">
        <h1>🛠️ Pannello Admin Riservato 🛠️</h1>
        <div class="admin-panel">
            <form id="adminForm">
                <input type="text" name="name" placeholder="Nome Prodotto" required>
                <input type="text" name="variant" placeholder="Variante (es. 30 Giorni / Lifetime)">
                <input type="number" step="0.01" name="price" placeholder="Prezzo (€)" required>
                <input type="number" name="stock" placeholder="Stock Disponibile" required>
                <input type="text" name="image" placeholder="URL Immagine Prodotto" required>
                <textarea name="description" placeholder="Descrizione"></textarea>
                <button type="submit">Aggiungi Prodotto & Invia Notifica Restock su Discord</button>
            </form>
        </div>
    </div>
    <script>
        fetch('/api/me').then(res => res.json()).then(({ user, isAdmin }) => {
            if (!user || !isAdmin) {
                alert('Accesso negato. Questa pagina è riservata ai fondatori.');
                window.location.href = '/';
                return;
            }
            const authArea = document.getElementById('authArea');
            authArea.innerHTML = `
                <div class="user-profile">
                    <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" alt="Avatar">
                    <span>${user.username}</span>
                </div>
                <a href="/logout" class="btn-logout">Esci</a>
            `;
            const links = document.getElementById('navLinks');
            const adminLink = document.createElement('a');
            adminLink.href = '/admin.html';
            adminLink.textContent = 'Pannello Admin';
            links.insertBefore(adminLink, authArea);
        });

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = Object.fromEntries(new FormData(e.target).entries());
            const res = await fetch('/api/admin/product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if(data.success) {
                alert('Prodotto aggiunto con successo e notifica inviata su Discord!');
                window.location.href = '/products.html';
            } else {
                alert('Errore: ' + data.error);
            }
        });
    </script>
</body>
</html>
