<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop - Pannello Admin</title>
    <link rel="stylesheet" href="/style.css"> <!-- O inserisci lo stile sopra -->
    <style>
        .admin-box { background: rgba(20, 0, 0, 0.9); border: 2px solid #ff2a00; padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 0 20px rgba(255,42,0,0.2); }
        .admin-box input, .admin-box textarea, .admin-box select { width: 100%; padding: 12px; margin: 8px 0; background: #0d0000; border: 1px solid #551111; color: white; border-radius: 6px; font-size: 1rem; }
        .btn-submit { background: #ff2a00; color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; font-size: 1.1rem; box-shadow: 0 0 10px rgba(255,42,0,0.5); transition: 0.2s; }
        .btn-submit:hover { background: #cc2200; }
        
        .product-manage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .manage-card { background: rgba(15, 0, 0, 0.85); border: 1px solid #441111; border-radius: 8px; padding: 15px; }
        .manage-card input { width: 100%; padding: 8px; margin: 5px 0; background: #050000; border: 1px solid #331111; color: #fff; border-radius: 4px; font-size: 0.9rem; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn-update { background: #00aa55; color: white; border: none; padding: 8px; border-radius: 4px; font-weight: bold; flex: 1; cursor: pointer; font-size: 0.85rem; }
        .btn-delete { background: #aa0000; color: white; border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="lightning-bg"></div>
    <nav>
        <div class="logo-container">
            <img src="/logo.jpg" alt="Logo" class="logo">
            <h2>Nova Shop</h2>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/products.html">Prodotti</a>
            <a href="/cart.html">Carrello</a>
            <span id="authArea"><a href="/auth/discord" class="btn-discord">Accedi</a></span>
        </div>
    </nav>

    <div class="container">
        <h1>🛠️ Pannello Gestione Admin 🛠️</h1>
        
        <div class="admin-box">
            <h3 style="margin-top:0; color:#ff5533;">➕ Aggiungi Nuovo Prodotto</h3>
            <form id="addProductForm">
                <input type="text" name="name" placeholder="Nome Prodotto" required>
                <input type="text" name="variant" placeholder="Variante (es. 30 Giorni / Lifetime)">
                <input type="number" step="0.01" name="price" placeholder="Prezzo (€)" required>
                <input type="number" name="stock" placeholder="Stock Iniziale (Se >= 1 invia Restock su Discord)" required>
                <input type="text" name="image" placeholder="URL Immagine" required>
                <textarea name="description" placeholder="Descrizione"></textarea>
                <button type="submit" class="btn-submit">Crea Prodotto & Notifica</button>
            </form>
        </div>

        <h2 style="color:#ff5533; font-size:1.4rem;">📦 Modifica / Gestisci Stock Esistenti</h2>
        <div id="manageProductsGrid" class="product-manage-grid">
            <p style="text-align:center; width:100%;">Caricamento prodotti...</p>
        </div>
    </div>

    <script>
        fetch('/api/me').then(res => res.json()).then(({ user, isAdmin }) => {
            if (!user || !isAdmin) {
                alert('Accesso negato.');
                window.location.href = '/';
                return;
            }
            document.getElementById('authArea').innerHTML = `
                <div class="user-profile">
                    <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" alt="Avatar">
                    <span>${user.username}</span>
                </div>
                <a href="/logout" class="btn-logout">Esci</a>
            `;
            const links = document.getElementById('navLinks');
            const adminLink = document.createElement('a');
            adminLink.href = '/admin.html';
            adminLink.textContent = 'Admin';
            links.insertBefore(adminLink, document.getElementById('authArea'));
        });

        // Aggiungi Prodotto
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = Object.fromEntries(new FormData(e.target).entries());
            const res = await fetch('/api/admin/product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if(data.success) {
                alert('Prodotto aggiunto con successo!');
                location.reload();
            } else {
                alert('Errore: ' + data.error);
            }
        });

        // Carica prodotti per la gestione
        async function loadManageProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const grid = document.getElementById('manageProductsGrid');

            if (products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">Nessun prodotto trovato.</p>';
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="manage-card">
                    <form onsubmit="updateProduct(event, ${p.id})">
                        <label style="font-size:0.8rem; color:#aaa;">Nome:</label>
                        <input type="text" name="name" value="${p.name}" required>
                        <label style="font-size:0.8rem; color:#aaa;">Variante:</label>
                        <input type="text" name="variant" value="${p.variant || ''}">
                        <label style="font-size:0.8rem; color:#aaa;">Prezzo (€):</label>
                        <input type="number" step="0.01" name="price" value="${p.price}" required>
                        <label style="font-size:0.8rem; color:#aaa;">Stock (Se >= 1 attiva Restock Discord):</label>
                        <input type="number" name="stock" value="${p.stock}" required>
                        <input type="hidden" name="image" value="${p.image}">
                        <input type="hidden" name="description" value="${p.description || ''}">
                        <div class="btn-group">
                            <button type="submit" class="btn-update">Salva & Stock</button>
                            <button type="button" class="btn-delete" onclick="deleteProduct(${p.id})">Elimina</button>
                        </div>
                    </form>
                </div>
            `).join('');
        }

        async function updateProduct(e, id) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const body = Object.fromEntries(formData.entries());

            const res = await fetch(`/api/admin/product/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                alert('Prodotto aggiornato! Notifica restock inviata se stock >= 1.');
                loadManageProducts();
            } else {
                alert('Errore: ' + data.error);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Sei sicuro di voler eliminare questo prodotto?')) return;
            const res = await fetch(`/api/admin/product/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                alert('Prodotto eliminato.');
                loadManageProducts();
            } else {
                alert('Errore eliminazione.');
            }
        }

        loadManageProducts();
    </script>
</body>
</html>
