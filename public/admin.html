<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop - Pannello Admin</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --primary: #ff2a00;
            --primary-glow: rgba(255, 42, 0, 0.4);
            --bg-glass: rgba(15, 2, 2, 0.85);
            --border-glass: rgba(255, 42, 0, 0.25);
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #050000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Navbar Modern & Clean */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--primary);
        }

        .logo-container h2 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links a {
            color: #bbb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
        }

        /* Container & Admin Layout */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
            position: relative;
            z-index: 2;
        }

        .page-title {
            font-size: 1.6rem;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 42, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-box {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .section-title {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .admin-box input, .admin-box textarea, .manage-card input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0 16px 0;
            background: rgba(10, 2, 2, 0.9);
            border: 1px solid rgba(255, 42, 0, 0.2);
            color: white;
            border-radius: 10px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .admin-box input:focus, .admin-box textarea:focus, .manage-card input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .admin-box textarea {
            resize: vertical;
            min-height: 90px;
        }

        .file-label {
            display: block;
            color: #bbb;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .btn-submit {
            background: linear-gradient(135deg, #ff2a00, #cc1100);
            color: white;
            border: none;
            padding: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: transform 0.1s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .product-manage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .manage-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .manage-card label {
            font-size: 0.8rem;
            color: #aaa;
            font-weight: 500;
            display: block;
            margin-top: 6px;
        }

        .manage-card input {
            margin: 4px 0 12px 0;
            padding: 10px;
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-update {
            background: #00aa55;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn-update:hover { opacity: 0.9; }

        .btn-delete {
            background: #aa0000;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn-delete:hover { opacity: 0.9; }

        .img-preview {
            width: 100%;
            height: 100px;
            object-fit: cover;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255, 42, 0, 0.2);
        }

        .info-message {
            text-align: center;
            color: #888;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 25px;
            border-radius: 14px;
            font-size: 0.95rem;
            grid-column: 1 / -1;
        }

        /* Profilo Utente Navbar */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-profile img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .user-profile span {
            font-size: 0.8rem;
            color: #ddd;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-logout {
            color: #ff5555 !important;
            font-size: 0.8rem !important;
        }

        @media (max-width: 480px) {
            nav { padding: 10px 15px; }
            .container { margin: 15px auto; }
            .admin-box { padding: 15px; }
            .page-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="sky-flash" id="flash"></div>
    <canvas id="lightningCanvas"></canvas>

    <nav>
        <div class="logo-container">
            <img src="/logo.jpg" alt="Logo" class="logo">
            <h2>Nova Shop</h2>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/products.html">Prodotti</a>
            <a href="/cart.html">Carrello</a>
            <span id="authArea"><a href="/auth/discord" class="btn-discord">Accedi</a></span>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">🛠️ Pannello Gestione Admin</h1>
        
        <div class="admin-box">
            <h3 class="section-title">➕ Aggiungi Nuovo Prodotto</h3>
            <form id="addProductForm">
                <input type="text" name="name" placeholder="Nome Prodotto" required>
                <input type="text" name="variant" placeholder="Variante (es. 30 Giorni / Lifetime)">
                <input type="number" step="0.01" name="price" placeholder="Prezzo (€)" required>
                <input type="number" name="stock" placeholder="Stock Iniziale (Se >= 1 invia Restock su Discord)" required>
                
                <span class="file-label">Immagine del Prodotto:</span>
                <input type="file" id="addProductImage" name="imageFile" accept="image/*" required>
                
                <textarea name="description" placeholder="Descrizione del prodotto"></textarea>
                <button type="submit" class="btn-submit">Crea Prodotto & Notifica</button>
            </form>
        </div>

        <h2 class="page-title" style="font-size: 1.3rem; margin-top: 40px;">📦 Modifica / Gestisci Stock Esistenti</h2>
        <div id="manageProductsGrid" class="product-manage-grid">
            <div class="info-message">Caricamento prodotti in corso...</div>
        </div>
    </div>

    <script>
        fetch('/api/me').then(res => res.json()).then(({ user, isAdmin }) => {
            if (!user || !isAdmin) {
                alert('Accesso negato.');
                window.location.href = '/';
                return;
            }
            document.getElementById('authArea').innerHTML = `
                <div class="user-profile">
                    <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" alt="Avatar">
                    <span>${user.username}</span>
                </div>
                <a href="/logout" class="btn-logout">Esci</a>
            `;
            const links = document.getElementById('navLinks');
            const adminLink = document.createElement('a');
            adminLink.href = '/admin.html';
            adminLink.textContent = 'Admin';
            links.insertBefore(adminLink, document.getElementById('authArea'));
        });

        // Gestione Invio Creazione Prodotto con FormData
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const imageInput = document.getElementById('addProductImage');
            if (imageInput.files && imageInput.files[0]) {
                formData.set('imageFile', imageInput.files[0]);
            }

            try {
                const res = await fetch('/api/admin/product', {
                    method: 'POST',
                    body: formData // Senza Content-Type esplicito, il browser imposta correttamente il multipart/form-data
                });
                const data = await res.json();
                if(data.success) {
                    alert('Prodotto aggiunto con successo!');
                    location.reload();
                } else {
                    alert('Errore: ' + (data.error || 'Impossibile aggiungere il prodotto'));
                }
            } catch (err) {
                alert('Errore di connessione con il server.');
            }
        });

        async function loadManageProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const grid = document.getElementById('manageProductsGrid');
            if (products.length === 0) {
                grid.innerHTML = '<div class="info-message">Nessun prodotto trovato.</div>';
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="manage-card">
                    <form onsubmit="updateProduct(event, ${p.id})">
                        <label>Nome:</label>
                        <input type="text" name="name" value="${p.name}" required>
                        <label>Variante:</label>
                        <input type="text" name="variant" value="${p.variant || ''}">
                        <label>Prezzo (€):</label>
                        <input type="number" step="0.01" name="price" value="${p.price}" required>
                        <label>Stock (Se >= 1 attiva Restock Discord):</label>
                        <input type="number" name="stock" value="${p.stock}" required>
                        
                        <label>Cambia Immagine (opzionale):</label>
                        <input type="file" id="file_edit_${p.id}" name="imageFile" accept="image/*">
                        ${p.image ? `<img src="${p.image}" class="img-preview" alt="Preview">` : ''}
                        
                        <input type="hidden" name="image" value="${p.image || ''}">
                        <input type="hidden" name="description" value="${p.description || ''}">
                        <div class="btn-group">
                            <button type="submit" class="btn-update">Salva</button>
                            <button type="button" class="btn-delete" onclick="deleteProduct(${p.id})">Elimina</button>
                        </div>
                    </form>
                </div>
            `).join('');
        }

        // Gestione Modifica Prodotto con FormData
        async function updateProduct(e, id) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            
            const fileInput = document.getElementById(`file_edit_${id}`);
            if (fileInput && fileInput.files && fileInput.files[0]) {
                formData.set('imageFile', fileInput.files[0]);
            }

            try {
                const res = await fetch(`/api/admin/product/${id}`, {
                    method: 'PUT',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    alert('Prodotto aggiornato! Notifica restock inviata se stock >= 1.');
                    loadManageProducts();
                } else {
                    alert('Errore: ' + (data.error || 'Modifica fallita'));
                }
            } catch (err) {
                alert('Errore di connessione con il server.');
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Sei sicuro di voler eliminare questo prodotto?')) return;
            const res = await fetch(`/api/admin/product/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                alert('Prodotto eliminato.');
                loadManageProducts();
            } else {
                alert('Errore eliminazione.');
            }
        }

        loadManageProducts();

        // Script Canvas Fulmini
        const canvas = document.getElementById('lightningCanvas');
        const ctx = canvas.getContext('2d');
        const flashEl = document.getElementById('flash');

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const config = { segmentLength: 12, growthSpeed: 2, deviation: 22, branchChance: 0.18 };
        let activeLightnings = [];

        class RealLightning {
          constructor(startX, startY, angle, isBranch = false, parentWidth = 4) {
            this.segments = [];
            this.currentProgress = 0;
            this.isBranch = isBranch;
            this.state = "GROWING";
            this.flickerFrame = 0;
            this.totalFlickers = 4 + Math.floor(Math.random() * 3);
            this.opacity = 1;
            this.lineWidth = isBranch ? parentWidth * 0.5 : parentWidth;
            this.generatePath(startX, startY, angle);
          }

          generatePath(x, y, angle) {
            let curX = x;
            let curY = y;
            this.segments.push({ x: curX, y: curY });
            while (curY < canvas.height && this.segments.length < 80) {
              const rad = (angle * Math.PI) / 180;
              const targetX = curX + Math.sin(rad) * config.segmentLength + (Math.random() - 0.5) * config.deviation;
              const targetY = curY + Math.cos(rad) * config.segmentLength + Math.random() * (config.segmentLength * 0.5);
              this.segments.push({ x: targetX, y: targetY });
              curX = targetX;
              curY = targetY;
              if (!this.isBranch && Math.random() < config.branchChance) {
                const branchAngle = angle + (Math.random() > 0.5 ? 45 : -45);
                activeLightnings.push(new RealLightning(curX, curY, branchAngle, true, this.lineWidth));
              }
            }
          }

          update() {
            if (this.state === "GROWING") {
              this.currentProgress += config.growthSpeed;
              if (this.currentProgress >= this.segments.length) {
                this.state = this.isBranch ? "FADING" : "STRIKE";
              }
            } else if (this.state === "STRIKE") {
              this.flickerFrame++;
              if (this.flickerFrame % 2 === 0) {
                flashEl.style.opacity = (Math.random() * 0.7 + 0.3).toString();
              } else {
                flashEl.style.opacity = '0';
              }
              if (this.flickerFrame >= this.totalFlickers * 2) {
                this.state = "FADING";
                flashEl.style.opacity = '0';
              }
            } else if (this.state === "FADING") {
              this.opacity -= 0.08;
            }
          }

          draw() {
            if (this.opacity <= 0 || this.currentProgress === 0) return;
            ctx.beginPath();
            ctx.moveTo(this.segments[0].x, this.segments[0].y);
            const limit = Math.min(this.currentProgress, this.segments.length);
            for (let i = 1; i < limit; i++) {
              ctx.lineTo(this.segments[i].x, this.segments[i].y);
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (this.state === "STRIKE" && this.flickerFrame % 2 !== 0) {
              ctx.strokeStyle = 'transparent';
            } else {
              ctx.strokeStyle = `rgba(255, 240, 240, ${this.opacity})`;
              ctx.lineWidth = this.state === "STRIKE" ? this.lineWidth * 1.5 : this.lineWidth;
            }
            ctx.stroke();
          }
        }

        function loop() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          activeLightnings = activeLightnings.filter(l => l.opacity > 0);
          activeLightnings.forEach(lightning => {
            lightning.update();
            lightning.draw();
          });
          requestAnimationFrame(loop);
        }

        function stormController() {
          const startX = Math.random() * canvas.width;
          flashEl.style.setProperty('--flash-x', `${(startX / canvas.width) * 100}%`);
          activeLightnings.push(new RealLightning(startX, 0, 0, false, 4.5));
          setTimeout(stormController, 1000 + Math.random() * 3500);
        }

        loop();
        setTimeout(stormController, 600);
    </script>
</body>
</html>
