<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop - I Miei Ordini</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .order-card { background: rgba(18, 0, 0, 0.85); border: 1px solid #441111; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .order-card h3 { margin: 0 0 5px; color: #ff5533; font-size: 1.1rem; }
        .order-card p { margin: 4px 0; font-size: 0.9rem; color: #ccc; }
    </style>
</head>
<body>
    <div class="lightning-bg"></div>
    <nav>
        <div class="logo-container">
            <img src="/logo.jpg" alt="Logo" class="logo">
            <h2>Nova Shop</h2>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/products.html">Prodotti</a>
            <a href="/cart.html">Carrello</a>
            <span id="authArea"><a href="/auth/discord" class="btn-discord">Accedi</a></span>
        </div>
    </nav>
    <div class="container">
        <h1>🛒 I Tuoi Ordini 🛒</h1>
        <div id="ordersContainer">
            <p style="text-align:center;">Caricamento ordini...</p>
        </div>
    </div>
    <script>
        fetch('/api/me').then(res => res.json()).then(({ user, isAdmin }) => {
            if (!user) {
                document.getElementById('ordersContainer').innerHTML = '<p style="text-align:center;">Effettua il login con Discord per vedere i tuoi ordini.</p>';
                return;
            }
            document.getElementById('authArea').innerHTML = `
                <div class="user-profile">
                    <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" alt="Avatar">
                    <span>${user.username}</span>
                </div>
                <a href="/logout" class="btn-logout">Esci</a>
            `;
            if (isAdmin) {
                const links = document.getElementById('navLinks');
                const adminLink = document.createElement('a');
                adminLink.href = '/admin.html';
                adminLink.textContent = 'Admin';
                links.insertBefore(adminLink, document.getElementById('authArea'));
            }

            fetch('/api/orders').then(res => res.json()).then(orders => {
                const container = document.getElementById('ordersContainer');
                if(orders.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">Non hai ancora effettuato ordini.</p>';
                } else {
                    container.innerHTML = orders.map(o => `
                        <div class="order-card">
                            <h3>Ordine #${o.id} - ${o.product_name}</h3>
                            <p><strong>Prezzo:</strong> €${o.price}</p>
                            <p><strong>Stato:</strong> <span style="color:#ff9900;">${o.status}</span></p>
                        </div>
                    `).join('');
                }
            });
        });
    </script>
</body>
</html>
