<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Shop - I Miei Ordini</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --primary: #ff2a00;
            --primary-glow: rgba(255, 42, 0, 0.4);
            --bg-glass: rgba(15, 2, 2, 0.75);
            --border-glass: rgba(255, 42, 0, 0.25);
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #050000;
            color: #fff;
            overflow-x: hidden;
        }

        /* Navbar Modern & Clean */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--primary);
        }

        .logo-container h2 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-links a {
            color: #bbb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
        }

        /* Container & Layout Ordini */
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 15px;
            position: relative;
            z-index: 2;
        }

        .page-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 42, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .orders-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s;
        }

        .order-card:hover {
            border-color: rgba(255, 42, 0, 0.5);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .order-header h3 {
            margin: 0;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .order-id {
            background: rgba(255, 42, 0, 0.15);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .order-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            color: #ccc;
        }

        .order-row span:first-child {
            color: #888;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 153, 0, 0.15);
            color: #ff9900;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255, 153, 0, 0.3);
        }

        .info-message {
            text-align: center;
            color: #888;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            padding: 25px;
            border-radius: 14px;
            font-size: 0.95rem;
        }

        /* Profilo Utente Navbar */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-profile img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .user-profile span {
            font-size: 0.8rem;
            color: #ddd;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-logout {
            color: #ff5555 !important;
            font-size: 0.8rem !important;
        }

        @media (max-width: 480px) {
            nav { padding: 10px 15px; }
            .container { margin: 15px auto; }
            .page-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="sky-flash" id="flash"></div>
    <canvas id="lightningCanvas"></canvas>

    <nav>
        <div class="logo-container">
            <img src="/logo.jpg" alt="Logo" class="logo">
            <h2>Nova Shop</h2>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/products.html">Prodotti</a>
            <a href="/cart.html">Carrello</a>
            <span id="authArea"><a href="/auth/discord" class="btn-discord">Accedi</a></span>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">🛒 I Tuoi Ordini</h1>
        <div id="ordersContainer" class="orders-grid">
            <div class="info-message">Caricamento ordini in corso...</div>
        </div>
    </div>

    <script>
        fetch('/api/me').then(res => res.json()).then(({ user, isAdmin }) => {
            if (!user) {
                document.getElementById('ordersContainer').innerHTML = '<div class="info-message">Effettua il login con Discord per visualizzare lo storico dei tuoi ordini.</div>';
                return;
            }
            document.getElementById('authArea').innerHTML = `
                <div class="user-profile">
                    <img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" alt="Avatar">
                    <span>${user.username}</span>
                </div>
                <a href="/logout" class="btn-logout">Esci</a>
            `;
            if (isAdmin) {
                const links = document.getElementById('navLinks');
                const adminLink = document.createElement('a');
                adminLink.href = '/admin.html';
                adminLink.textContent = 'Admin';
                links.insertBefore(adminLink, document.getElementById('authArea'));
            }

            fetch('/api/orders').then(res => res.json()).then(orders => {
                const container = document.getElementById('ordersContainer');
                if(orders.length === 0) {
                    container.innerHTML = '<div class="info-message">Non hai ancora effettuato alcun ordine.</div>';
                } else {
                    container.innerHTML = orders.map(o => `
                        <div class="order-card">
                            <div class="order-header">
                                <h3>${o.product_name}</h3>
                                <span class="order-id">#${o.id}</span>
                            </div>
                            <div class="order-body">
                                <div class="order-row">
                                    <span>Prezzo:</span>
                                    <strong>€${o.price}</strong>
                                </div>
                                <div class="order-row" style="align-items: center; margin-top: 4px;">
                                    <span>Stato:</span>
                                    <span class="status-badge">${o.status}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            });
        });

        // Script Canvas Fulmini
        const canvas = document.getElementById('lightningCanvas');
        const ctx = canvas.getContext('2d');
        const flashEl = document.getElementById('flash');

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const config = { segmentLength: 12, growthSpeed: 2, deviation: 22, branchChance: 0.18 };
        let activeLightnings = [];

        class RealLightning {
          constructor(startX, startY, angle, isBranch = false, parentWidth = 4) {
            this.segments = [];
            this.currentProgress = 0;
            this.isBranch = isBranch;
            this.state = "GROWING";
            this.flickerFrame = 0;
            this.totalFlickers = 4 + Math.floor(Math.random() * 3);
            this.opacity = 1;
            this.lineWidth = isBranch ? parentWidth * 0.5 : parentWidth;
            this.generatePath(startX, startY, angle);
          }

          generatePath(x, y, angle) {
            let curX = x;
            let curY = y;
            this.segments.push({ x: curX, y: curY });
            while (curY < canvas.height && this.segments.length < 80) {
              const rad = (angle * Math.PI) / 180;
              const targetX = curX + Math.sin(rad) * config.segmentLength + (Math.random() - 0.5) * config.deviation;
              const targetY = curY + Math.cos(rad) * config.segmentLength + Math.random() * (config.segmentLength * 0.5);
              this.segments.push({ x: targetX, y: targetY });
              curX = targetX;
              curY = targetY;
              if (!this.isBranch && Math.random() < config.branchChance) {
                const branchAngle = angle + (Math.random() > 0.5 ? 45 : -45);
                activeLightnings.push(new RealLightning(curX, curY, branchAngle, true, this.lineWidth));
              }
            }
          }

          update() {
            if (this.state === "GROWING") {
              this.currentProgress += config.growthSpeed;
              if (this.currentProgress >= this.segments.length) {
                this.state = this.isBranch ? "FADING" : "STRIKE";
              }
            } else if (this.state === "STRIKE") {
              this.flickerFrame++;
              if (this.flickerFrame % 2 === 0) {
                flashEl.style.opacity = (Math.random() * 0.7 + 0.3).toString();
              } else {
                flashEl.style.opacity = '0';
              }
              if (this.flickerFrame >= this.totalFlickers * 2) {
                this.state = "FADING";
                flashEl.style.opacity = '0';
              }
            } else if (this.state === "FADING") {
              this.opacity -= 0.08;
            }
          }

          draw() {
            if (this.opacity <= 0 || this.currentProgress === 0) return;
            ctx.beginPath();
            ctx.moveTo(this.segments[0].x, this.segments[0].y);
            const limit = Math.min(this.currentProgress, this.segments.length);
            for (let i = 1; i < limit; i++) {
              ctx.lineTo(this.segments[i].x, this.segments[i].y);
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            if (this.state === "STRIKE" && this.flickerFrame % 2 !== 0) {
              ctx.strokeStyle = 'transparent';
            } else {
              ctx.strokeStyle = `rgba(255, 240, 240, ${this.opacity})`;
              ctx.lineWidth = this.state === "STRIKE" ? this.lineWidth * 1.5 : this.lineWidth;
            }
            ctx.stroke();
          }
        }

        function loop() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          activeLightnings = activeLightnings.filter(l => l.opacity > 0);
          activeLightnings.forEach(lightning => {
            lightning.update();
            lightning.draw();
          });
          requestAnimationFrame(loop);
        }

        function stormController() {
          const startX = Math.random() * canvas.width;
          flashEl.style.setProperty('--flash-x', `${(startX / canvas.width) * 100}%`);
          activeLightnings.push(new RealLightning(startX, 0, 0, false, 4.5));
          setTimeout(stormController, 1000 + Math.random() * 3500);
        }

        loop();
        setTimeout(stormController, 600);
    </script>
</body>
</html>
