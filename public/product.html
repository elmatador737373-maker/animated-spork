<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Prodotto - Nova Shop</title>
    <!-- Tailwind CSS per una grafica pulita e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- NAVBAR -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center">
        <a href="/index.html" class="text-xl font-bold tracking-wider text-red-500 flex items-center gap-2">
            <i class="fa-solid fa-store"></i> NOVA SHOP
        </a>
        <div id="auth-container">
            <!-- Dinamico via JS -->
            <a href="/auth/discord" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fa-brands fa-discord"></i> Login con Discord
            </a>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="flex-grow container mx-auto px-4 py-10 max-w-4xl">
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
            <p>Caricamento prodotto in corso...</p>
        </div>

        <div id="product-container" class="hidden bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl grid grid-cols-1 md:grid-cols-2 gap-8 p-6 md:p-8">
            <!-- Immagine Prodotto -->
            <div class="flex items-center justify-center bg-slate-950 rounded-xl overflow-hidden border border-slate-800 h-80">
                <img id="prod-image" src="" alt="Immagine Prodotto" class="object-cover w-full h-full">
            </div>

            <!-- Dettagli Prodotto -->
            <div class="flex flex-col justify-between">
                <div>
                    <span id="prod-variant" class="inline-block bg-red-500/10 text-red-400 text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wider"></span>
                    <h1 id="prod-name" class="text-3xl font-extrabold text-white mb-2"></h1>
                    <p id="prod-price" class="text-2xl font-bold text-emerald-400 mb-4"></p>
                    <p id="prod-description" class="text-slate-400 text-sm leading-relaxed mb-6"></p>
                    <div class="flex items-center gap-2 text-sm text-slate-300 mb-6">
                        <i class="fa-solid fa-box text-red-500"></i> Stock disponibile: <span id="prod-stock" class="font-bold text-white"></span>
                    </div>
                </div>

                <!-- Pulsante Acquisto / Azione -->
                <div id="action-area">
                    <!-- Inserito dinamicamente via JS (es. Compra o Login Obbligatorio) -->
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        &copy; 2026 Nova Shop. Tutti i diritti riservati. Powered by Discord & Supabase.
    </footer>

    <!-- SCRIPT LOGICA PAGINA -->
    <script>
        async function init() {
            // 1. Controlla autenticazione utente
            let currentUser = null;
            try {
                const authRes = await fetch('/api/auth/me');
                const authData = await authRes.json();
                const authContainer = document.getElementById('auth-container');

                if (authData.loggedIn) {
                    currentUser = authData.user;
                    authContainer.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${currentUser.avatar}" alt="Avatar" class="w-8 h-8 rounded-full border border-slate-700">
                            <span class="text-sm font-medium text-slate-200">${currentUser.global_name}</span>
                            <a href="/auth/logout" class="text-slate-400 hover:text-red-400 text-xs ml-2" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></a>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Errore controllo auth:", err);
            }

            // 2. Estrai l'ID del prodotto dall'URL (?id=...)
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.getElementById('loading').innerHTML = '<p class="text-red-500">ID prodotto non specificato nell URL.</p>';
                return;
            }

            // 3. Recupera i dati del prodotto dal backend
            try {
                const res = await fetch(`/api/products/${productId}`);
                if (!res.ok) throw new Error('Prodotto non trovato');
                const product = await res.json();

                // Popola i campi HTML
                document.getElementById('prod-name').textContent = product.name;
                document.getElementById('prod-variant').textContent = product.variant || 'Standard';
                document.getElementById('prod-price').textContent = `€${Number(product.price).toFixed(2)}`;
                document.getElementById('prod-description').textContent = product.description || 'Nessuna descrizione disponibile.';
                document.getElementById('prod-stock').textContent = product.stock;
                document.getElementById('prod-image').src = product.image || 'https://via.placeholder.com/400';

                const actionArea = document.getElementById('action-area');

                if (product.stock <= 0) {
                    actionArea.innerHTML = `<button disabled class="w-full bg-slate-800 text-slate-500 font-bold py-3 px-6 rounded-xl cursor-not-allowed">Prodotto Esaurito</button>`;
                } else if (!currentUser) {
                    actionArea.innerHTML = `
                        <a href="/auth/discord" class="block text-center w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-indigo-600/20">
                            <i class="fa-brands fa-discord mr-2"></i> Effettua il Login per Acquistare
                        </a>
                    `;
                } else {
                    actionArea.innerHTML = `
                        <button id="buy-btn" onclick="buyProduct('${product.id}')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-red-600/20 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-shopping"></i> Acquista Subito
                        </button>
                    `;
                }

                // Mostra il container e nascondi il loading
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('product-container').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = '<p class="text-red-500">Errore nel caricamento del prodotto o prodotto inesistente.</p>';
            }
        }

        // Funzione di acquisto
        async function buyProduct(productId) {
            const btn = document.getElementById('buy-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Elaborazione ordine...';

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId })
                });

                const data = await res.json();

                if (res.ok) {
                    alert(`Ordine #${data.order.id} creato con successo! Verrai reindirizzato al server Discord per completare il pagamento.`);
                    window.location.href = data.discordServerUrl;
                } else {
                    alert(data.error || 'Errore durante la creazione dell ordine.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-cart-shopping"></i> Acquista Subito';
                }
            } catch (err) {
                console.error(err);
                alert('Errore di connessione al server.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cart-shopping"></i> Acquista Subito';
            }
        }

        init();
    </script>
</body>
</html>
