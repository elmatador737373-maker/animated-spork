<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettagli Prodotto - Nova Shop</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Stesso sfondo dinamico con bagliori e fulmini rossi */
        body {
            background-color: #020204;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(220, 38, 38, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(185, 28, 28, 0.15) 0%, transparent 45%),
                linear-gradient(to right, rgba(220, 38, 38, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(220, 38, 38, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            background-attachment: fixed;
        }

        .neon-glow {
            text-shadow: 0 0 25px rgba(239, 68, 68, 0.6), 0 0 50px rgba(220, 38, 38, 0.3);
        }

        .laser-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.8), transparent);
            z-index: 100;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-red-600 selection:text-white">

    <div class="laser-line"></div>

    <!-- NAVBAR -->
    <header class="bg-slate-950/80 backdrop-blur-xl border-b border-red-950/40 sticky top-0 z-50 py-3.5 px-4 sm:px-8 flex justify-between items-center">
        <a href="/" class="text-base sm:text-xl font-black tracking-wider text-white flex items-center gap-2.5">
            <div class="bg-gradient-to-br from-red-600 via-rose-700 to-black p-2 rounded-xl shadow-lg shadow-red-600/30 border border-red-500/40 text-white">
                <i class="fa-solid fa-bolt-lightning text-red-400"></i>
            </div>
            <span>NOVA<span class="text-red-500 neon-glow">SHOP</span></span>
        </a>

        <!-- Auth Area -->
        <div id="auth-container">
            <a href="/auth/discord" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shadow-lg shadow-indigo-600/20 flex items-center gap-2">
                <i class="fa-brands fa-discord text-base"></i> <span class="hidden xs:inline">Login con Discord</span>
            </a>
        </div>
    </header>

    <!-- MAIN PRODUCT CONTENT -->
    <main class="flex-grow container mx-auto px-4 py-8 sm:py-12 max-w-4xl">
        <a href="/" class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold text-slate-400 hover:text-red-400 mb-6 transition">
            <i class="fa-solid fa-arrow-left"></i> Torna al catalogo
        </a>

        <div id="loading" class="text-center py-20 text-slate-500">
            <i class="fa-solid fa-bolt fa-spin text-3xl mb-3 text-red-600"></i>
            <p class="text-xs sm:text-sm">Caricamento dettagli prodotto...</p>
        </div>

        <div id="product-detail" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8 bg-slate-900/50 backdrop-blur-xl border border-slate-800/90 rounded-3xl p-6 sm:p-8 shadow-2xl">
            <!-- Immagine Prodotto -->
            <div class="rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 h-64 sm:h-80 relative flex items-center justify-center">
                <img id="p-image" src="" alt="Prodotto" class="w-full h-full object-cover">
                <div id="p-badge" class="absolute top-4 right-4 bg-slate-950/90 backdrop-blur-md text-emerald-400 text-xs font-black px-3.5 py-1.5 rounded-xl border border-emerald-500/30 shadow-lg">
                    €0.00
                </div>
            </div>

            <!-- Info e Acquisto -->
            <div class="flex flex-col justify-between">
                <div>
                    <span id="p-variant" class="text-[10px] font-extrabold text-red-400 uppercase tracking-widest bg-red-500/10 px-2.5 py-1 rounded border border-red-500/20">Standard</span>
                    <h1 id="p-name" class="text-2xl sm:text-3xl font-black text-white mt-3 mb-2 leading-tight">Nome Prodotto</h1>
                    <p id="p-desc" class="text-slate-400 text-xs sm:text-sm leading-relaxed mb-6">Descrizione del prodotto...</p>
                    <div class="text-xs text-slate-400 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-box text-red-500"></i> Stock disponibile: <span id="p-stock" class="font-bold text-white">0</span>
                    </div>
                </div>

                <!-- Azione / Pulsante Acquista -->
                <div id="buy-section">
                    <!-- Iniettato via JS in base allo stock e login -->
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-950/80 border-t border-red-950/30 py-6 text-center text-xs text-slate-600">
        <p>&copy; 2026 Nova Shop &bull; Secure Discord Integration</p>
    </footer>

    <!-- SCRIPT -->
    <script>
        async function loadProductPage() {
            // 1. Auth check
            let isLogged = false;
            try {
                const authRes = await fetch('/api/auth/me');
                const authData = await authRes.json();
                const authContainer = document.getElementById('auth-container');

                if (authData.loggedIn) {
                    isLogged = true;
                    const user = authData.user;
                    authContainer.innerHTML = `
                        <div class="flex items-center gap-2.5 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl shadow-lg">
                            <img src="${user.avatar}" alt="Avatar" class="w-7 h-7 rounded-full border border-red-500/50">
                            <span class="text-xs sm:text-sm font-bold text-slate-200 max-w-[100px] sm:max-w-[140px] truncate">${user.global_name}</span>
                            <a href="/auth/logout" class="text-slate-400 hover:text-red-400 text-xs ml-1 transition" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></a>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Auth error:", err);
            }

            // 2. Prendi ID prodotto dall'URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.getElementById('loading').innerHTML = '<p class="text-red-500">Prodotto non specificato.</p>';
                return;
            }

            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                const product = products.find(p => p.id == productId);

                document.getElementById('loading').style.display = 'none';

                if (!product) {
                    document.getElementById('loading').innerHTML = '<p class="text-red-500">Prodotto non trovato.</p>';
                    return;
                }

                document.getElementById('product-detail').classList.remove('hidden');
                document.getElementById('p-image').src = product.image || 'https://via.placeholder.com/400x300?text=Nova+Shop';
                document.getElementById('p-badge').textContent = `€${Number(product.price).toFixed(2)}`;
                document.getElementById('p-variant').textContent = product.variant || 'Standard';
                document.getElementById('p-name').textContent = product.name;
                document.getElementById('p-desc').textContent = product.description || 'Nessuna descrizione specificata.';
                document.getElementById('p-stock').textContent = product.stock;

                const buySection = document.getElementById('buy-section');

                if (product.stock <= 0) {
                    buySection.innerHTML = `
                        <button disabled class="w-full bg-slate-800 text-slate-500 font-bold py-3 px-4 rounded-xl cursor-not-allowed text-sm">
                            Prodotto Esaurito (Out of Stock)
                        </button>
                    `;
                } else if (!isLogged) {
                    buySection.innerHTML = `
                        <a href="/auth/discord" class="block text-center w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm flex items-center justify-center gap-2">
                            <i class="fa-brands fa-discord"></i> Effettua il Login per Acquistare
                        </a>
                    `;
                } else {
                    buySection.innerHTML = `
                        <button onclick="buyProduct(${product.id})" class="w-full bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-xl shadow-red-600/30 text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-bag-shopping"></i> Conferma e Acquista Ora
                        </button>
                    `;
                }

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = '<p class="text-red-500">Errore nel caricamento del prodotto.</p>';
            }
        }

        async function buyProduct(productId) {
            if (!confirm("Confermi l'acquisto di questo prodotto?")) return;

            try {
                const res = await fetch('/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId })
                });
                const data = await res.json();

                if (res.ok) {
                    alert("Acquisto completato con successo! Controlla i tuoi messaggi o Discord.");
                    window.location.href = '/';
                } else {
                    alert("Errore durante l'acquisto: " + (data.error || 'Riprova più tardi.'));
                }
            } catch (err) {
                console.error(err);
                alert("Errore di connessione.");
            }
        }

        loadProductPage();
    </script>
</body>
</html>
